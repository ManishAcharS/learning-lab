name: taskflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-taskflow}
      POSTGRES_USER: ${POSTGRES_USER:-taskflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - taskflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # The hostname ``db`` is the Compose service name. Username, password,
      # and database name must match the PostgreSQL service settings above.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      TASKFLOW_JWT_SECRET: ${TASKFLOW_JWT_SECRET:?TASKFLOW_JWT_SECRET must be set in .env}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taskflow_pgdata:
